{% assign skills = site.data.skills.skills | default: [] %} {% if skills.size >
0 %}

<section id="skills" class="py-2 border-b border-slate-100">
  <h2 class="text-lg font-bold text-slate-900 mb-2">Technical Skills</h2>

  <div class="grid md:grid-cols-2 gap-2">
    {% for skill in skills %}

    <div
      class="group rounded-md border border-slate-200 p-2 transition-all duration-300 hover:bg-white hover:border-indigo-300 hover:shadow-sm"
    >
      <div class="flex items-center gap-1.5 mb-1.5">
        <div
          class="w-6 h-6 flex items-center justify-center rounded bg-indigo-100 text-indigo-600 group-hover:bg-indigo-600 group-hover:text-white transition"
        >
          <i class="{{ skill.icon }} text-xs"></i>
        </div>

        <h3 class="font-semibold text-slate-800 text-xs">
          {{ skill.category }}
        </h3>
      </div>

      <div class="flex flex-wrap gap-1">
        {% for item in skill.items %}

        <span
          class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-white/60 border border-slate-200 text-[10px] text-slate-700 hover:bg-white hover:border-indigo-300 hover:text-indigo-700 transition"
        >
          {% if item.logo != "" %}

          <img
            src="https://cdn.simpleicons.org/{{ item.logo }}"
            alt="{{ item.name }}"
            class="w-3 h-3"
          />

          {% endif %} {{ item.name }}
        </span>

        {% endfor %}
      </div>
    </div>

    {% endfor %}
  </div>
</section>

{% endif %}
