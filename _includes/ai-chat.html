<style>
  /* ===============================
   MOONIRUL FLOATING AI
================================ */

  .moonirul-ai-toggle {
    position: fixed;

    right: 30px;

    bottom: 70px;

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background: #4f46e5;

    color: white;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 25px;

    cursor: pointer;

    box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);

    z-index: 9999;

    transition: 0.3s;
  }

  .moonirul-ai-toggle:hover {
    transform: translateY(-4px);

    background: #3730a3;
  }

  /* AI WINDOW */

  .moonirul-ai-wrapper {
    position: fixed;

    right: 30px;

    bottom: 140px;

    width: 420px;

    max-width: calc(100vw - 40px);

    z-index: 9998;

    opacity: 0;

    visibility: hidden;

    transform: translateY(30px) scale(0.95);

    transition: 0.3s ease;
  }

  .moonirul-ai-wrapper.active {
    opacity: 1;

    visibility: visible;

    transform: translateY(0) scale(1);
  }

  /* CLOSE */

  .moonirul-close {
    position: absolute;

    right: 12px;

    top: 12px;

    width: 32px;

    height: 32px;

    border-radius: 50%;

    border: none;

    background: #f1f5f9;

    color: #334155;

    font-size: 20px;

    cursor: pointer;

    z-index: 10;
  }

  /* MAIN BOX */

  .moonirul-ai-box {
    width: 100%;

    padding: 25px;

    background: #ffffff !important;

    border: 1px solid #e2e8f0 !important;

    border-radius: 18px;

    box-shadow: 0 15px 40px rgba(15, 23, 42, 0.15);

    font-family: "Plus Jakarta Sans", sans-serif;
  }

  .moonirul-ai-box h3 {
    margin: 0 0 20px;

    color: #172554 !important;

    font-size: 20px;

    font-weight: 800;
  }

  /* Suggestions */

  .moonirul-ai-suggestions {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 15px;
  }

  .moonirul-ai-suggestions button {
    padding: 7px 12px;

    background: #f8fafc !important;

    color: #334155 !important;

    border: 1px solid #e2e8f0 !important;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;
  }

  .moonirul-ai-suggestions button:hover {
    background: #172554 !important;

    color: white !important;
  }

  /* CHAT */

  .moonirul-ai-chat {
    height: 250px;

    overflow-y: auto;

    padding: 12px;

    background: #f8fafc !important;

    border: 1px solid #e2e8f0 !important;

    border-radius: 14px;
  }

  .moonirul-user {
    max-width: 80%;

    margin: 10px 0 10px auto;

    padding: 10px 14px;

    background: #172554 !important;

    color: white !important;

    border-radius: 14px 14px 3px 14px;

    font-size: 13px;
  }

  .moonirul-bot {
    max-width: 85%;

    margin: 10px auto 10px 0;

    padding: 10px 14px;

    background: white !important;

    color: #334155 !important;

    border: 1px solid #e2e8f0 !important;

    border-radius: 14px 14px 14px 3px;

    font-size: 13px;

    line-height: 1.6;
  }

  /* INPUT */

  .moonirul-ai-input {
    display: flex;

    gap: 10px;

    margin-top: 12px;
  }

  .moonirul-ai-input input {
    flex: 1;

    padding: 11px;

    border-radius: 10px;

    border: 1px solid #cbd5e1 !important;

    font-size: 13px;
  }

  .moonirul-ai-input button {
    padding: 10px 18px;

    background: #4f46e5 !important;

    color: white !important;

    border: none !important;

    border-radius: 10px;

    cursor: pointer;

    font-weight: 700;
  }

  @media (max-width: 600px) {
    .moonirul-ai-wrapper {
      right: 15px;

      bottom: 120px;

      width: calc(100vw - 30px);
    }

    .moonirul-ai-toggle {
      right: 20px;

      bottom: 70px;
    }
  }
</style>

<!-- FLOATING BUTTON -->

<div class="moonirul-ai-toggle" onclick="toggleMoonirulAI()">🤖</div>

<!-- AI WINDOW -->

<div class="moonirul-ai-wrapper" id="moonirulAI">
  <button class="moonirul-close" onclick="toggleMoonirulAI()">×</button>

  <div class="moonirul-ai-box">
    <h3>🤖 Ask Moonirul AI</h3>

    <div class="moonirul-ai-suggestions">
      <button onclick="moonirulSuggest(this)">Who is Moonirul?</button>

      <button onclick="moonirulSuggest(this)">Technical Skills</button>

      <button onclick="moonirulSuggest(this)">AI Projects</button>

      <button onclick="moonirulSuggest(this)">Experience</button>

      <button onclick="moonirulSuggest(this)">Research</button>

      <button onclick="moonirulSuggest(this)">Education</button>
    </div>

    <div class="moonirul-ai-chat" id="moonirul-chat">
      <div class="moonirul-bot">Hi 👋 Ask me anything about Moonirul's CV.</div>
    </div>

    <div class="moonirul-ai-input">
      <input
        id="moonirul-question"
        placeholder="Ask about Moonirul..."
        onkeypress="if (event.key === 'Enter') moonirulAsk();"
      />

      <button onclick="moonirulAsk()">Ask</button>
    </div>
  </div>
</div>

<script>
  function toggleMoonirulAI() {
    document.getElementById("moonirulAI").classList.toggle("active");
  }

  const moonirulCV = {
    name: "Md. Monirul Islam",

    skills:
      "AI Engineering, LangChain, LangGraph, MCP Server, OpenAI API, Python, JavaScript, FastAPI, React, TensorFlow, Keras, Scikit-learn, NLP and Computer Vision.",

    projects:
      "Podcast & WordPress Content Automation, AI Voice Doctor Appointment System, ML Diabetes Prediction SaaS and AI Resume Builder SaaS.",

    experience:
      "AI Automation Engineer at Softvence Delta. Developed AI automation workflows using Python, FastAPI, n8n, JavaScript and OpenAI APIs.",

    education:
      "BSc in Computer Science and Engineering from Green University of Bangladesh with CGPA 3.72/4.00.",

    research:
      "Computer Vision Based Real-Time Air Quality Index Estimation and Bengali Meme Vision Language Analysis.",
  };

  function moonirulSuggest(btn) {
    document.getElementById("moonirul-question").value = btn.innerText;

    moonirulAsk();
  }

  function moonirulAsk() {
    let input = document.getElementById("moonirul-question");

    let q = input.value.trim();

    if (!q) return;

    let text = q.toLowerCase();

    let answer = "Sorry, I don't have this information yet.";

    if (text.includes("who") || text.includes("name")) {
      answer =
        moonirulCV.name + " is a CSE graduate and AI Automation Engineer.";
    } else if (text.includes("skill")) {
      answer = moonirulCV.skills;
    } else if (text.includes("project")) {
      answer = moonirulCV.projects;
    } else if (text.includes("experience") || text.includes("work")) {
      answer = moonirulCV.experience;
    } else if (text.includes("education")) {
      answer = moonirulCV.education;
    } else if (text.includes("research")) {
      answer = moonirulCV.research;
    }

    let chat = document.getElementById("moonirul-chat");

    chat.innerHTML += `


<div class="moonirul-user">

${q}

</div>



<div class="moonirul-bot">

${answer}

</div>


`;

    chat.scrollTop = chat.scrollHeight;

    input.value = "";
  }
</script>
